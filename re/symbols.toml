# Analog Rytm MKII symbol map.
#
# Addresses are virtual (load base 0x40000400); file_offset = addr - 0x40000400.
# status = "verified"  established by decompilation/disassembly of this exact image
#          "inferred"  reasoned from surrounding evidence, NOT directly proven
#          "external"  taken from a reference repo, not re-derived here
# Consumed by tools/symbols.py -> build/symbols.inc (assembler) and a Ghidra annotator.
#
# Nothing here yet. Unlike the Octatrack, this image is a C++ build with its
# Itanium-ABI symbol names left in, so most of the map can be recovered by
# demangling rather than by guessing - see re/subsystems/README.md.

[meta]
target        = "OS1.73"
base          = 0x40000400
mainos_size   = 3005432
mainos_sha256 = "28d9ef40c895e03f17dfce096543109adaf708947392db72818fc2a412d685d6"

# The bootstrap ships in the same container (section 2, load base 0x07020000) and is
# also ColdFire. It is READ-ONLY here: it is the recovery path that survives a bad
# MAIN OS, and nothing in this project writes to it. See docs/HAZARDS.md.
bootstrap_size   = 42302
bootstrap_sha256 = "1b8d3b7288df118512740ac7c59d8dd9f71f44e6633a29628bcb068d756e2ed8"
bootstrap_base   = 0x07020000

# ----------------------------------------------------------------- microtiming
# See mods/0001-microtiming-fine/design.md. The site that turns the stored value
# into a time offset is NOT here yet - it has not been found.

[fn.Pattern_getMicrotiming]
addr = 0x400c02dc
sig = "int8(Pattern *this, int step)"
status = "verified"
note = "Clamps step to 0..63, virtual-calls vtable[10] for the pattern storage pointer, reads the signed byte at +0x140+step and returns it plus 64. Every caller sign-extends the low byte and subtracts 64, so the bias cancels. All four callers are UI: 0x4004512a (menu), 0x400a8a66 (step-attribute dispatch), 0x400c8a40 (differs-from-on-grid test), and 0x400452a2."

[data.microtiming_label_table]
addr = 0x401cd86c
status = "verified"
note = "24 pointers, index n -> the display string for n/384 reduced. Index 0 is \"ON GRID\". Sign is applied separately by the \"-%s\"/\"+%s\" formats at 0x40240155/0x40240159. Two entries point into another menu's strings (1/64, 1/32) and several are suffixes of longer strings in the same block, so the table is the authority, not string order."

[data.microtiming_clamp_lo]
addr = 0x40045136
status = "verified"
note = "moveq #-23,%d0 - the low clamp in the microtiming menu's change path, immediately after `addil #-64,%d2` un-biases the getter's result."

[data.microtiming_clamp_hi]
addr = 0x40045146
status = "verified"
note = "moveq #23,%d7 - the high clamp, same routine."

[data.microtiming_pack_site]
addr = 0x40008e90
status = "verified"
note = "Packs the microtiming byte into a 6-bit two's-complement field: lsl #6 / moveb (320,%a4),%d1 / and #63 / add / moveb %d0,(304,%a5). This is why the stored range cannot be widened past [-32,+31] without changing a serialisation format."

[const.MICROTIMING_MAX]
value = 23
status = "verified"
note = "Full-scale microtiming, in units of 1/384 of a whole note = 1/24 of a 1/16 step."

[fn.trig_fire]
addr = 0x4009a9bc
sig = "void(int track, int ctx, int step, int slot)"
status = "verified"
note = "Builds and dispatches one trig. Reads the per-step arrays at +0x80 note, +0xc0 velocity, +0x100 length, +0x140 microtiming, each 64 bytes, with -1 meaning \"use the track default\" at +0x2c0/+0x2c1/+0x2c2. Computes the microtiming offset for this trig and for the next one, and the gap between them as (next - this) / 6. Handles both the audio tracks and the slot==-1 case from one body."

[data.microtiming_scale_shift]
addr = 0x4009ace8
status = "verified"
note = "moveq #9,%d4 - the shift that builds the microtiming scale factor: scale = ((0x7f - amount) * 0x10205 >> 16) << d4, which is 0x10000 (unity) when amount is 0. The offset is then (scale * step_unit * micro) >> 16. d4 is dead two instructions later, overwritten by the mvsb at 0x4009acfa, so this shift is the ONLY consumer and changing it scales microtiming and nothing else. Mod 0001 sets it to 7."

[data.microtiming_unit_mul]
addr = 0x4009acfe
status = "verified"
note = "mulsw #25,%d0 - one microtiming unit is 25 engine ticks. The only `mulsw #25` in the image. Its sibling constant is the 600-tick step at 0x4009adaa (local_28 * cVar10 * 600), so a step is 24 microtiming units exactly."

[const.MICROTIMING_UNIT_TICKS]
value = 25
status = "verified"
note = "Engine ticks per microtiming unit. Step = 600 ticks, so the engine runs at 600 ticks per 1/16 = 2400 PPQN, 25x finer than the 1/384-note microtiming grid. That headroom is what makes mod 0001 possible."

[const.STEP_TICKS]
value = 600
status = "verified"
note = "Engine ticks in one sequencer step, before the per-step scale factor from the table at 0x401db44b is applied."

# --------------------------------------------------- microtiming UI and keys
# Groundwork from the page-nudge investigation that was dropped once stock's
# own gesture turned out to cover it. See re/subsystems/microtiming.md.

[fn.Pattern_setMicrotiming]
addr = 0x400c0878
sig = "void(Pattern *this, int step, char biased)"
status = "verified"
note = "Clamps step to 0..63, ignores steps past the pattern length, un-biases the argument by 0x40, clamps to [-23,+23], writes the byte at +0x140+step, then raises a change notification through vtable[4] carrying the step. The only supported way to write microtiming - it owns the clamp."

[fn.microtiming_change]
addr = 0x40045232
sig = "void(MicroTimingMenuView *this, int delta, char all)"
status = "verified"
note = "all == 0 schedules a per-trig change for the held trig. all != 0 walks step 0..patternLength-1 on the CURRENT TRACK, and for every step with a trig does setMicrotiming(step, get(step) + delta), bracketed by vtable[0x3c](1,1) / vtable[0x3c](0,0) and a closing vtable[0x10](0). That batch-and-notify bracket is the pattern to copy for any bulk trig edit."

[fn.microtiming_menu_keys]
addr = 0x40045328
sig = "char(MicroTimingMenuView *this, KeyEvent *ev)"
status = "verified"
note = "Slot 2 of the vtable at 0x401cd8f4. Handles key codes 0x40/0x41 (LEFT/RIGHT) as delta -1/+1, passing event flag bit 1 as the `all` argument. Gated on trig_keys_held, so it does nothing unless a TRIG key is down."

[fn.microtiming_menu_draw]
addr = 0x40044ef4
sig = "void(MicroTimingMenuView *this, Canvas *c)"
status = "verified"
note = "Slot 4. Titles the view MICRO TIME ALL when is_key_held(KEY_FUNC), MICRO TIMING otherwise, and draws the ruler and the label from microtiming_label_table. Also gated on trig_keys_held."

[fn.trig_keys_held]
addr = 0x400367c6
sig = "int(void *this)"
status = "verified"
note = "Non-zero if any TRIG key is currently held within the pattern length. Builds a (1 << len) - 1 mask and ANDs it against the 64-bit held-trig bitmap at this+0x158 / this+0x15c. This is the gate that makes the whole microtiming view trig-modal: with no trig down it neither draws nor takes arrows."

[fn.is_key_held]
addr = 0x40081bbc
sig = "uint(int keyId)"
status = "verified"
note = "Maps keyId through the RAM table at 0x418d0be0 to a bit index, then tests that bit in the key-state bitmap at 0x418d1340. A negative table entry means the key is absent and reads as not held. The RAM table is the inverse of the ROM list key_scan_ids, built at startup by 0x400824ce, so the numbering is recoverable from the image."

[fn.pattern_track]
addr = 0x400ab232
sig = "TrackPattern *(Pattern *this, int track)"
status = "verified"
note = "Clamps track to 0..12 and returns this + 0x70 + track * 0x60. Thirteen slots - twelve voices plus the FX track - each with its own trigs and its own 64-byte microtiming array. This is why stock's MICRO TIME ALL is per track and not pattern-wide."

[fn.current_track_pattern]
addr = 0x400af076
sig = "TrackPattern *(Project *this)"
status = "verified"
note = "The selected track's block of the active pattern: pattern_track(activePattern(this), currentTrack(this)). What every microtiming entry point operates on."

[fn.pattern_length]
addr = 0x400c04b8
sig = "int(TrackPattern *this)"
status = "verified"
note = "Step count. Bounds the all-trigs loop, bounds setMicrotiming's write, and sets the mask width in trig_keys_held."

[fn.pattern_step_has_trig]
addr = 0x400bff12
sig = "char(TrackPattern *this, int step)"
status = "inferred"
note = "Read only from its use in microtiming_change's all-trigs loop, where steps failing this test are skipped. Consistent with `step has a trig`, but it could equally be a broader `step is active` - not confirmed against a second call site."

[data.pattern_grid_view_vtable]
addr = 0x401cc67c
status = "verified"
note = "PatternGridView. Slot 2 is the key handler, slot 4 the draw - same layout as the microtiming view's vtable at 0x401cd8f4. MicroTimingMenuView is constructed as a member of PatternGridView by its constructor at 0x4003b2e0."

[fn.pattern_grid_view_keys]
addr = 0x4003cc94
status = "inferred"
note = "Slot 2 of pattern_grid_view_vtable, so by position the grid view's key handler. Read out of the table, NOT yet disassembled. This is where a gesture that must work with no trig held would have to hook, since microtiming_menu_keys never runs in that state."

[const.KEY_LEFT]
value = 0x40
status = "verified"
note = "Key code, from microtiming_menu_keys testing `code - 0x40 < 2` and deriving delta -1 for 0x40."

[const.KEY_RIGHT]
value = 0x41
status = "verified"

[const.KEY_FUNC]
value = 0x80
status = "verified"
note = "Both the key code seen by handlers and the id passed to is_key_held - 24 call sites, by far the most of any id, as befits the global modifier."

[const.KEY_TRK]
value = 0x86
status = "verified"
note = "TRK, from TrackSelectionView's key handler: releasing 0x86 closes the view (its vtable +0x2c), while it is up a pad selects that track and key 0x10 selects track 12. Also tested with is_key_held at 0x400c7b72 and in AnalogControlView (0x40125fd2). Confirmed on hardware by mod 0014, which gates on is_key_held(0x86)."

[data.key_scan_ids]
addr = 0x40285670
status = "verified"
note = "ROM list of key ids in scan order, 88 longs then -1. 0x400824ce fills the RAM table at 0x418d0be0 with its inverse (id -> scan bit) for is_key_held; unlisted ids stay -1. Groups: 0x00-0x0f the trig keys, 0x90-0x9b the pads, 0x30-0x35 the six page keys, 0x40-0x43 the arrows, 0x80 FUNC, 0x86 TRK; 0x87 is filler."

# ------------------------------------------------------- audio engine boundary
# See re/subsystems/audio-engine.md. image = "hardware" keeps these out of both
# generated outputs; they are documentation of a boundary, not patch targets.

[data.fpga_reg_base]
addr  = 0xec094000
image = "hardware"
status = "inferred"
note = "Base of the byte-wide register file MAIN OS drives, 0xec094000..0xec09406e, 57 distinct addresses. Called FPGA by position only - it is the external chip-select window and the bootstrap's self-test names FPGA as a device - not by reading a part number. A second, sparser block sits at 0xec070000/0xec074000 on a 4-byte stride."

[data.fpga_status_reg]
addr  = 0xec094018
image = "hardware"
status = "verified"
note = "One of only three addresses in the whole window that MAIN OS ever reads. Its sole reader, fpga_status_bit5, returns bit 5 and nothing else. The other two reads are 0xec09401d and 0xec090014, each read exactly once. Everything else in the window is write-only - this interface carries no telemetry."

[fn.fpga_status_bit5]
addr = 0x4000076a
sig = "byte(void)"
status = "verified"
note = "`return DAT_ec094018 & 0x20;` - the entire function. Quoted in the subsystem note as the evidence that the audio side reports nothing useful back."

# ------------------------------------------------------- euclidean + trig flags

[fn.euclid_generate]
addr = 0x400c1998
sig = "void(TrackPattern *this, char notify)"
status = "verified"
note = "The euclidean generator. Returns immediately unless euclid_enabled_get says 1. Runs two Bjorklund passes - counter = (pulses * rotation) % len; per step hit = counter < pulses, counter = (counter + pulses) % len - into 64-byte bool arrays at 0x4196dbb8 (gen 1) and 0x4196db78 (gen 2), combines them through one of four std::function operators selected per track, then fills the step map. Lazily constructs the four combiners on first use, guarded by DAT_4196dc04."

[data.euclid_enabled]
addr = 0x000002ca
image = "hardware"
status = "verified"
note = "Offset, not an address: per-track byte at TrackPattern+0x2ca, 1 = euclidean mode on. Read by euclid_generate via its getter at 0x400c0e02 and directly by trig_fire at 0x4009aaca."

[data.euclid_step_map]
addr = 0x000002d1
image = "hardware"
status = "verified"
note = "Offset, not an address: per-track 64-byte array at TrackPattern+0x2d1. Per step, -1 means no euclidean trig; otherwise the ORDINAL of that trig (0,1,2,...). trig_fire uses the ordinal as a step index to fetch note/velocity/length, so the euclidean pattern picks WHEN and the grid's own trigs supply WHAT. Accessors at 0x400c1242 (get) and 0x400c128a (set); the only playback reader is trig_fire, at 0x4009aaf0 and 0x4009ad80."

[fn.trig_flags_set]
addr = 0x400c2416
sig = "void(TrackPattern *this, int step, ushort mask, char on)"
status = "verified"
note = "Generic read-modify-write on a step's 16-bit trig word (array of 64 words at TrackPattern+0x00). Clamps the step, refuses past the pattern length, and brackets the change with vtable[0x3c](1,1). Setting bit 0 also forces 0x200 when neither 0x80 nor 0x100 is set."

[const.TRIG_BIT_TRIG]
value = 0x0001
status = "verified"
note = "Step has a trig. trig_fire forces this bit on for euclidean steps."

[const.TRIG_BIT_LOCK]
value = 0x0004
status = "inferred"
note = "Set means trig_fire bails out before producing a note - consistent with a lock/trigless trig. Named from behaviour, not from a UI string."

[const.TRIG_BIT_ACCENT]
value = 0x0008
status = "verified"
note = "Identified from the caller of its setter, FUN_40042330, which references the strings ACCENT and CLEAR ACCENT."

[const.TRIG_BIT_SWING]
value = 0x0010
status = "verified"
note = "Setter called from FUN_400675d2, adjacent to the swing menu code at 0x40067700. Matches trig_fire, where this bit gates the swing term."

[const.TRIG_BIT_SLIDE]
value = 0x0020
status = "verified"
note = "Setter called from FUN_4004ea7e, which references PARAMETER SLIDE / CLEAR PARAM SLIDE. Matches trig_fire, where this bit triggers the forward scan for the next trig - slide needs its target."

[fn.euclid_bake]
addr = 0x400c3c0e
sig = "void(TrackPattern *this)"
status = "verified"
note = "The FREEZE TRACK path. Called from the euclid toggle handler at 0x400d1c10 only when isKeyHeld(KEY_FUNC). Walks steps BACKWARDS from len-1: map[step] < 0 clears the trig and its note/velocity/length; otherwise every attribute is copied from the ordinal step onto this step. Backwards because the ordinal is always <= the step, so descending never overwrites a source before it is read. Toggling euclid off without FUNC does nothing, because live euclidean never writes to the pattern."

[fn.euclid_toggle_handler]
addr = 0x400d1c10
sig = "int(View *this, KeyEvent *ev)"
status = "verified"
note = "On the euclid key with FUNC held and euclid on, shows FREEZE TRACK, calls euclid_bake then clears euclid_enabled. Otherwise falls through to the stock handler at 0x40039f3c."

[fn.euclid_bool_op_get]
addr = 0x400c11b0
sig = "byte(TrackPattern *this)"
status = "verified"
note = "Returns TrackPattern+0x2d0 raw. euclid_generate uses it as an index into a 4-entry, 0x40-byte combiner array, so it must keep returning 0..3 - this is why mod 0002 does not widen the stored value."

[fn.euclid_bool_op_set]
addr = 0x400c11e0
sig = "void(TrackPattern *this, int value)"
status = "verified"
note = "Clamps to 0..3 and writes TrackPattern+0x2d0."

[fn.euclid_bool_op_format]
addr = 0x400ff3da
status = "verified"
note = "Renders the Bool Operator value: takes arg >> 8, clamps to 0..3 (moveq #3 at 0x400ff3e0 and 0x400ff3ea), indexes euclid_bool_op_labels, tail-calls the formatter at 0x40163254."

[data.euclid_bool_op_labels]
addr = 0x401ec400
status = "verified"
note = "Exactly four pointers: OR, XOR, AND, SUB. Referenced once, from euclid_bool_op_format. Immediately followed by an unrelated table (attack-time labels), so it cannot be extended in place."

[data.euclid_bool_op]
addr  = 0x000002d0
image = "hardware"
status = "verified"
note = "Offset, not an address: per-track byte at TrackPattern+0x2d0, the Bool Operator, 0..3. Saved via the copy at 0x40008d56 / 0x40008f5e. The six euclidean parameters occupy +0x2cb..+0x2d0 - PL1, PL2, RO1, RO2, TRO and this - each with a save/load copy pair into the storage struct at +0x27a..+0x27f, so there is NO free byte in that run."

[data.trig_fire_euclid_flag_load]
addr = 0x4009aaca
status = "verified"
note = "moveb %a0@(714),%d0 in trig_fire - a0 is the track base from the lea at 0x4009aac4. The result becomes (enabled == 1) and is stashed at %sp@(44); the beqs at 0x4009aaec sends a zero down the ordinary grid path with d3 = step. seq sets the flag only when raw ^ 1 is zero, so an accent track carrying raw == 3 takes the grid path. Mod 0002 detours here to mask raw to bits 0..1 first, so bits 2..5 used by other mods do not turn euclid off."

[data.trig_fire_grid_flags_load]
addr = 0x4009ab72
status = "verified"
note = "mvzw %a2@(0,%d0:l),%d2 - the non-euclidean arm loading the step's trig word, with d0 = a3 + step*2 and d3 = step. Six bytes to the euclid arm's label including the following bras, so a jmp fits. d0 is dead straight after, reassigned from d2 at 0x4009ab8c where the paths converge. Mod 0002's second detour site."

[data.param_get_boolop_arm]
addr = 0x400a884c
status = "verified"
note = "The get-by-id switch arm for Bool Operator: jsr euclid_bool_op_get, then mvsb and lsll #8, so parameter values travel in the high byte of a word - which is what euclid_bool_op_format's arg >> 8 undoes. Repointing the jsr target is a 4-byte patch at +2."

[data.param_set_boolop_arm]
addr = 0x400a9caa
status = "verified"
note = "The set-by-id switch arm for Bool Operator: jsr euclid_bool_op_set. euclid_bool_op_set has no other callers, and euclid_bool_op_get's only other caller is euclid_generate, which needs it to keep returning 0..3 - so the composite 0..7 value is produced and consumed here, on the UI path only."

[fn.euclid_step_map_get]
addr = 0x400c1242
sig = "int8(TrackPattern *this, int step)"
status = "verified"
note = "Clamps the step to 0..63 and returns the euclid step map byte, or -1 when there is no storage. Negative means no euclidean hit at that step."

[data.trig_fire_flags_join]
addr = 0x4009ab8c
status = "verified"
note = "Where trig_fire's euclidean and grid arms converge: movel %d2,%d0 with d2 holding the assembled flags word. Mod 0002's accent detour jumps here after re-emitting the grid arm's load."

[data.euclid_bake_body]
addr = 0x400c3c16
status = "verified"
note = "euclid_bake past its prologue - lea %sp@(-120),%sp then moveml %d2-%d7/%a2-%fp,%sp@. Mod 0002 detours the entry, re-emits both and jumps here for the stock path. moveal %sp@(124),%a2 here expects the argument at sp+124, which is where the lea leaves it."

# ------------------------------------------------- parameter rendering, bitmaps

[fn.bitmap_ctor]
addr = 0x4006f9c2
sig = "void(Bitmap *dest, int w, int h, void *pixels, void *mask)"
status = "verified"
note = "Bitmap objects are 28 bytes; the drawer reads width at +4 and height at +8. Pixel format is COLUMN-MAJOR, one 32-bit big-endian word per column. The rows are the TOP h bits of each word with the LOWEST of them the top row: for h = 12, bit 20 is row 0 and bit 31 row 11 (0002, hardware: a mark at bit 20 drew above the glyph). A 17x12 icon is therefore 68 bytes."

[fn.bitmap_set_make]
addr = 0x401b7cd0
sig = "void(BitmapSet *set, Bitmap *first, int count, void *)"
status = "verified"
note = "Called at 0x40143124 with count = 4 to build the Bool Operator icon set at 0x419f23c4 from four Bitmap objects on the stack. Repointing that one jsr is the hook for extending the set to eight."

[data.boolop_icon_set]
addr = 0x419f23c4
image = "hardware"
status = "verified"
note = "RAM. The four Bool Operator icons - logic-gate glyphs: OR, XOR (double input line), AND (flat input side) and the SUB glyph. Pixel data at 0x402becd8 / 0x402bed1c / 0x402bed60 / 0x402beda4, 0x44 apart, sharing the full-height mask at 0x402bec94 (0xfff00000 per column). All 17x12."

[fn.boolop_icon_draw]
addr = 0x400ff472
sig = "void(Canvas *, int value8, int, int, int)"
status = "verified"
note = "The renderer the euclidean page actually uses for Bool Operator: takes value >> 8, clamps to 0..3 at 0x400ff476 and 0x400ff492, fetches that icon from boolop_icon_set and centres it. NOT euclid_bool_op_format - that text formatter belongs to a different std::function slot (0x419a42d0) and never reaches this page. Mod 0002's label-table patch is consequently inert."

[fn.bitmap_draw]
addr = 0x40071674
sig = "void(Canvas *, Bitmap *, int x, int y, int, int centred)"
status = "verified"
note = "Draws a Bitmap. With the last argument set, x and y are the centre: half the width (+4) and height (+8) are subtracted first. filter_type_knob_draw tail-calls it with 1."

[data.filter_type_icon_set]
addr = 0x419f1b38
status = "verified"
note = "RAM. The FILTER page's TYP glyphs: a BitmapSet, begin at +0, end at +4, 28-byte Bitmaps. Built at 0x40146a66 by bitmap_set_make with count 8 from eight 21x13 Bitmaps (bitmap_ctor, w 0x15, h 0xd) with pixel data at filter_type_icon_pixels + 0x54 * k, sharing the mask at 0x402b214c (0xfff80000 per column, 13 rows). In order LP2, LP1, BP, HP1, HP2, BS, PK - the labels of filter_type_labels - and a blank eighth. Not checked on the device."

[data.filter_type_icon_pixels]
addr = 0x402b21a0
status = "verified"
note = "ROM. The eight TYP glyphs' pixel data, 21 columns of one long each, 0x54 apart, 13 rows in bits 19..31, bit 19 the top row (bitmap_ctor). So read, the seven match the label order: LP2 flat at the top left and falling steeply, LP1 falling gently, BP a peak, HP1 and HP2 rising, BS a notch, PK a bump. The device's FILTER page shows LP2's glyph so (screenshot, 2026-09-29)."

[fn.filter_type_knob_draw]
addr = 0x400ff0a6
status = "verified"
note = "TYP's (id 49) knob draw callback: the invoker of the std::function set into its RAM record's +0x24 at 0x401a91d4 (manager 0x400fe84c at +0x2c, invoker at +0x30), in place of the dial template 0x419a4618. Called as (functor, value, x, y, h, 1). Takes value >> 8, clamps it to 0 .. count - 1 of filter_type_icon_set (count from its begin/end, / 28 by the multiply 0xb6db6db7 after >> 2), and tail-calls bitmap_draw with that Bitmap, x, y and centred = 1. So the knob shows the type's glyph and no dial."

[fn.filter_type_text]
addr = 0x400ff1a2
status = "verified"
note = "TYP's popup formatter, the invoker at its RAM record's +0x20: value >> 8 clamped to 0..6, \"%s\" (0x402410a4) of filter_type_labels, through 0x40098602."

[data.sound_config_changed_info_vt]
addr = 0x401cb5dc
status = "verified"
note = "SoundConfigChangedInfo's vtable (typeinfo name at 0x401cb37c's). The change notice stock's sound settings setters send after writing the live sound's settings bytes - ENV RESET's (0x400bcee4, +0x6c) and those at 0x400bc6f0..0x400bce82 (+0x69, +0x6a, +0x6b), 18 sites in all - as an 8-byte object {this vtable, byte 1}, through the track's sound accessor's vtable +16. The parameter bank's drain does not carry bytes outside the 42 parameters; a live-sound write without this notice is lost at a reboot unless the kit is saved (0013, hardware, 2026-09-29)."

[fn.sound_page_draw]
addr = 0x400d2e1a
sig = "void(SoundPageView *, Canvas *)"
status = "verified"
