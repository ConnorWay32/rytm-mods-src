status = "verified"
note = "The modflags word is +0x24 of each 0x34-byte record, in the corrected frame above. Dumped over all 469 records: 0x600 -> 348, 0 -> 113, 0x200 -> exactly 7, 0x10000 -> exactly 1. The 0x200 set is ids 64,65,66,68,69,70,71 - every LFO control except Destination - which is exactly the set a modulation destination list should offer. 0x10000 is on id 67 (Destination) alone. This distribution is what corroborates the corrected frame over the 0x401bf940 one; a name-only check cannot tell the two apart."

