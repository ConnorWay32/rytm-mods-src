# ------------------------------------------------ sound record and live sound
# Sound index = the parameter record's +0x04 for sound parameters, 0..41. The live
# sound keeps its 42 values at +0x14 + 2*index; storage keeps 42 mapped slots at
# +0x1c + 2*slot inside a 48-word member. Sound index 0 has no parameter record
# and maps to slot 41. See re/subsystems/lfo.md Q1, Q8, Q9, and sound-storage.md.

[fn.sound_load]
addr = 0x400081f6
sig = "bool(Sound *live, SoundStorage *storage)"
status = "verified"
note = "Storage -> live for a v4 sound record. memset(live+0x14, 0, 0x54), then live[0x14 + 2*sound_index_of_slot[k]] = storage[0x1c + 2*k] for k = 0..41; storage slots 42..47 are never read. Unpacks +0x7c/+0x7d into live +0x68..+0x6c and loads the modTarget routes. The live object is 0x98 bytes and is copied by value, so the target is often a heap temporary."

[fn.sound_save]
addr = 0x4000843a
sig = "bool(SoundStorage *storage, Sound *live, ...)"
status = "verified"
note = "Live -> storage. Writes magic 0xbeefbace and version 4, memset(storage+0x1c, 0, 0x60), then the 42 mapped slots through sound_slot_map, and the sentinel 0xbacef00c at +0x9e. So every save zeroes storage slots 42..47; slot 41 (sound index 0) is written like any other. Ten callers."

[data.sound_slot_map]
addr = 0x401c59cc
status = "verified"
note = "Voice sound index -> storage slot, a 42-entry permutation of 0..41. Index 0 -> slot 41. Its inverse (slot -> index) is the table directly after, at 0x401c5a74, so the map cannot grow in place. The FX-track pair is 0x401c589c / 0x401c5934 (38 entries). Getters: 0x40007602 (index -> slot) and 0x400075c8 (slot -> index), each choosing the FX table for track 12."

[fn.sound_init_defaults]
addr = 0x400122b6
sig = "void(Sound *live, int, int machine)"
status = "verified"
note = "Fills a live sound with defaults. Sets +0x68..+0x6b, then for index 0..41 asks sound_param_id_for_index; writes 0 where it returns 0, else the parameter's default via 0x40006ff0. Index 0 is never in the table, so a fresh sound always has 0 at index 0. Called at 0x4001242e, 0x400bcdf0 and 0x400bd7fc."

[fn.sound_param_id_for_index]
addr = 0x40007028
sig = "int(int soundIndex, int machine)"
status = "verified"
note = "Sound index -> parameter id, 0 when none. Indices 9..16 (machine parameters) read the per-machine table 0x413db5fc[machine*8 + index-9]; other indices read the 42-entry table 0x413db554. Both are RAM, built by param_tables_build."

[fn.param_tables_build]
addr = 0x40006cd8
status = "verified"
note = "Zeroes and fills the RAM index -> id tables from the ROM parameter records: 0x413db554 (42 longs), 0x413db4ac (42), 0x413db464 (18) and 0x413db5fc (0x6a0 B, per machine). Routing is by the record's +0x00 kind: kinds 53..55 fill 0x413db554 at the record's +0x04, which covers sound indices 17..41 only, so entry 0 stays 0. The records at index 0 - id 28 (kind 62) and id 29 NOT (kind 61) - never reach it."

[fn.param_container_index]
addr = 0x40006ea8
sig = "int(int paramId)"
status = "verified"
note = "Returns the ROM parameter record's +0x04 - the index within its own container (sound, trig, ...). Not a global index: VEL (trig) and LFO MUL (sound) both return 1."

[fn.param_is_machine]
addr = 0x40006f18
sig = "bool(int paramId)"
status = "verified"
note = "Whether the ROM parameter record's kind (+0x00) is 0..52, a machine's own parameter. SoundParameterSet's write (0x400a9d7e) then compares the record's machine (0x4000714a) with the live sound's +0x68 and returns without writing when they differ."

[fn.sound_randomize]
addr = 0x400bc5f2
