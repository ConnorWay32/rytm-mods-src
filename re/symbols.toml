# ----------------------------------------------------- effects returns, PRE and POST
# Traced 2026-09-21 for mods/0006-comp-preview. Two return mixers read the SAME two
# effect output buffers and differ only in which gain bank scales them, so the buffer
# address discriminates nothing - reading the wrong bank models a signal that never
# reaches the compressor, and the trace still looks plausible. The bank is everything.
#
#   formatter 0x400fbe1e   array[0]="PRE", array[1]="POST"      -> value 0 is PRE
#   router    0x4010e8a0   flag 0 -> bank 0, AND zeroes bank 1
#   bank 0    0x42fb4ab4   consumed by 0x4010eb26 -> output +48  <- drives the compressor
#   bank 1    0x42fb4abc   consumed by 0x4010ebfe -> output +56
#
# The router zeroing the unselected bank is what makes an estimator safe: read bank 0
# unconditionally and a POST setting contributes zero on its own, per effect, with no
# need to read the flag at all.

[fn.fx_return_mix_pre]
addr = 0x4010eb26
sig = "void(int out_slot)"
status = "verified"
note = "The PRE return mixer - the one whose output reaches the analog mixer before distortion and the compressor, so it is the only return that drives the detector. Reads the delay output at 0x80007c44 and the reverb output at 0x80007b44, scales them by the bank 0 gains ramping from 0x419ca020/0x419ca024 toward 0x42fb4ab4/0x42fb4ab8 in (target-current)>>5 steps across 32 frames, and writes stereo into the output ring at 0x80000030 + (slot<<11) on a 64-byte frame stride. In the EMAC loop d1 (toward 0x42fb4ab4) multiplies the sample loaded from 0x80007c44 and d0 (toward 0x42fb4ab8) the one from 0x80007b44, which is what fixes delay to slot 0 and reverb to slot 1. NOT a returns-only mix: the loop takes a THIRD source through a4/a5, at 0x42ac6f30 + (*0x8000fef4)*1536 + 8 and + 12 on a 48-byte frame stride, with a FIXED coefficient d5 = 0xeb2a7c30 rather than a ramped gain - so each output sample is a sum of four scalar-times-sample products, not two. That third source is fx_mix_ring channels 2 and 3, and it is NOT the dry voice sum: the voices occupy channels 4..11 of the same ring, per voice_channel_map, and this mixer never reads them. So an estimator that reconstructs the voices itself and adds delay and reverb here does not double-count. What channels 2/3 carry is still open - see fx_mix_stage_buffer. Note also that this project has a history of mis-decoded EMAC operands, so the coefficient-to-source pairing above deserves re-checking before anything depends on it."

[fn.fx_return_mix_post]
addr = 0x4010ebfe
sig = "void(int out_slot)"
status = "verified"
note = "The POST return mixer. Same two source buffers, bank 1 gains at 0x42fb4abc/0x42fb4ac0 against currents 0x419ca018/0x419ca01c, writing the output ring at 0x80000038 + (slot<<11). Its output is summed after the compressor, so it does NOT drive the detector and an estimator must not include it. This is the wrong-bank trap: nothing about the audio it reads distinguishes it from fx_return_mix_pre."

[data.fx_return_gain_route_site]
addr = 0x4010e8a0
status = "verified"
note = "Routes each effect's return gain to one bank and zeroes the other. Per effect: reads the flag byte, computes (flag != 0) as 0 or 1, scales the level word, stores the product at base + 8*index and clears base + 8*(1-index). Delay uses base 0x42fb4ab4 with level 0x8000fbb8 and flag 0x8000fbbc; reverb uses base 0x42fb4ab8 with level 0x8000fbca and flag 0x8000fbcc. The clear of the unselected bank is the load-bearing detail for any estimator."

[fn.fx_prepost_format]
addr = 0x400fbe1e
sig = "void(char **out, int value_8_8)"
status = "verified"
note = "Formatter for the returns' PRE/POST parameter. Builds a two-entry array on the stack - array[0] = \"PRE\" at 0x40237586, array[1] = \"POST\" at 0x40245029 - arithmetic-shifts the 8.8 value right by 8, clamps it to 0..1 and indexes. This is what fixes value 0 as PRE, and with it bank 0 as the pre-compressor return."

[data.fx_return_gain_pre]
addr = 0x42fb4ab4
status = "verified"
note = "Bank 0, the PRE return gain targets: delay at +0, reverb at +4 (0x42fb4ab8). Written by fx_return_gain_route_site, consumed by fx_return_mix_pre. Zero for an effect whose PRE/POST parameter is POST. An estimator reads these two words and needs nothing else to get the routing right."

[data.fx_return_gain_post]
addr = 0x42fb4abc
status = "verified"
note = "Bank 1, the POST return gain targets: delay at +0, reverb at +4 (0x42fb4ac0). Consumed by fx_return_mix_post. Recorded so it is named and can be avoided, not so it can be used."

[data.fx_return_gain_pre_current]
addr = 0x419ca020
status = "verified"
note = "The ramped current values behind fx_return_gain_pre - delay at +0, reverb at +4 - stepped toward the targets across the 32 frames of a block. A per-block estimator should read the target rather than this, which costs at most one block of ramp and avoids depending on where in the block it is sampled. The POST pair is at 0x419ca018/0x419ca01c."

[data.fx_delay_out]
addr = 0x80007c44
status = "verified"
note = "The first effect processor's stereo output, 32 frames, read by BOTH return mixers. Verified as the source multiplied by the bank slot-0 gain in fx_return_mix_pre; that the first effect is the delay is inferred from re/subsystems/compressor-hardware.md, not re-derived here."

[data.fx_reverb_out]
addr = 0x80007b44
status = "verified"
note = "The second return source, read by BOTH return mixers and multiplied by the bank slot-1 gain. Also the reverb send input, processed in place, so the return mixers - which run before current-block FX generation at 0x4010e650 - see the previous block's result. That one-block skew is far below the preview trace's resolution: the trace pins one bar to 64 columns at any tempo, so a column is roughly 47 blocks at 120 BPM and fewer as the tempo rises - still tens of blocks either way."

[data.output_ring_base]
addr = 0x80000000
status = "verified"
note = "Output ring, four slots of 2048 B, addressed as base + (slot << 11) with a 64-byte frame stride. The PRE return pair lands at +48/+52 within each frame and the POST pair at +56/+60; other writers use +36, +40 and +44. Which physical output each frame word feeds is NOT established here - the PRE/POST question was settled by the gain bank, not by the channel map."

[const.OUTPUT_FRAME_STRIDE]
value = 64
status = "verified"
note = "Bytes per frame in the output ring: fx_return_mix_pre writes two longwords then advances by 56."

[const.FX_RETURN_PRE_OFFSET]
value = 48
status = "verified"
note = "Byte offset of the PRE return stereo pair within an output ring frame. POST is at 56."

[data.fx_return_route_flag_delay]
addr = 0x8000fbbc
status = "inferred"
note = "Read as a signed byte by fx_return_gain_route_site and used as the delay return's bank selector; the reverb's is at 0x8000fbcc. That these bytes ARE the PRE/POST parameter fx_prepost_format renders is inferred, not traced: both reads are absolute, there is no absolute writer, and the parameter block is reached through a base register. The circumstantial case is strong - they sit just below the compressor parameter block at 0x8000fbd4, so the same FX-track parameter area, and the formatter is exactly two-valued. To close it, read these bytes back on the device and confirm they move 0 <-> 1 with the UI control."

[data.fx_return_level_delay]
addr = 0x8000fbb8
status = "inferred"
note = "Read as a signed word by fx_return_gain_route_site and scaled into the return gain; the reverb's is at 0x8000fbca. Verified as the level input to the gain computation; that it is the user-facing return level parameter is inferred from position in the same block as fx_return_route_flag_delay. Gain units are not established from the code; 0006 carries a measured constant per return instead (CAL_DELAY, CAL_REVERB, re/subsystems/compressor-model.md)."

# The frame ring the return mixers read their third source from. Traced 2026-09-21
# to settle whether an estimator adding the returns would double-count the voices.
# It would not: the voices are channels 4..11, and the return mixers read 2 and 3.

[data.fx_mix_ring]
addr = 0x42ac6f30
status = "verified"
note = "Double-buffered frame ring, slot = *0x8000fef4, 1536 B per slot, 32 frames of 48 B, 12 longword channels per frame. Channels 4..11 are the eight physical voices, reached through the permutation table at voice_channel_map. Channels 0/1 and 2/3 are two stereo pairs staged from fx_mix_stage_buffer by the loop at 0x4011fc82, which de-interleaves a stereo source into one pair or the other. fx_return_mix_pre reads channels 2 and 3 - NOT the voices - which is what says an estimator summing delay and reverb on top of its own voice reconstruction does not double-count."

[data.fx_mix_ring_slot]
addr = 0x8000fef4
status = "verified"
note = "The fx_mix_ring double-buffer index, toggled by the eorl at 0x40121458 once a block. Readers derive the byte offset as (slot<<11) - (slot<<9), i.e. slot * 1536."

[data.voice_channel_map]
addr = 0x401bea90
status = "verified"
note = "Eight signed bytes, 4, 7, 5, 8, 10, 9, 11, 6, then -1 padding: physical voice index to fx_mix_ring channel. Read with mvsb %a4@+ at 0x4010ea94, where a negative entry selects a different mix path. This is the permutation the handover means by \"physical order differs from receive order\". It is also the FIRST object in rodata - .text ends at exactly this address, which `make cavescan` derives independently."

[fn.voice_output_mix]
addr = 0x4010ea30
sig = "void(..., long *out_frames)"
status = "verified"
note = "Per-voice output mixer. Walks voice_channel_map, and for each voice mixes sources at 0x800067f8/0x80006bf8/0x80007000/0x80007040 - or, when the map entry is non-negative, the fx_mix_ring channel it names - into the output ring on a 64-byte frame stride, EMAC fractional mode with macsr = 160. Runs immediately before fx_return_mix_pre."

[fn.fx_generate]
addr = 0x4010e650
sig = "void(void *block)"
status = "verified"
note = "Current-block effects generation, called from the block driver at 0x4012139a. The return mixers run BEFORE it, so they consume the previous block's delay and reverb output. 0006's audio hook at 0x401213a0 sits immediately AFTER it, inside the window 0x4012139a..0x4012143a that compressor-hardware.md identifies as the right one: there the receive buffer holds block k's voices unmutated, the FX buffers hold block k's fresh output, and the coefficient getter returns the four-tick-old bank matching those voices. The remaining offset is NOT about reading earlier or later here. In analog time the FX buffer in hand is AHEAD of the voice words in hand - the voices at k are an ADC capture of audio from about k-4, while the FX derived from them still has to leave through the DAC - so an exact model pairs the current voices with an OLDER FX block, which needs a history ring of about six to eight blocks. A model that skips the ring reads returns that the compressor has not heard yet; the trace misplaces them by well under a column, but the detector is nonlinear and 2.67 ms is comparable to the faster ATK settings, so this is an accuracy cost rather than a free simplification. A hook here must also leave MACSR at its resting 0x20 and must not disturb the accumulators, which the interrupt prologue saved for the interrupted context, not for callers inside it."

[data.fx_mix_stage_buffer]
addr = 0x42ac6e24
status = "inferred"
note = "Stereo staging buffer copied into fx_mix_ring channels 0/1 or 2/3 by the loop at 0x4011fc82, and passed to 0x4013f56c in place of the ring when the block driver's mode selector at 0x4012136c equals 5. Verified as the source of the pair fx_return_mix_pre reads; WHAT it carries is not established. External input and USB input are the natural candidates - EXT IN is documented as joining after the distortion and before the compressor, which is where this pair lands - but that is a hypothesis. Both are already outside the reconstruction's declared scope, so if it is either, the term 0006 omits is a known scope limit rather than a new gap."

