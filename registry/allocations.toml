# addr   = 0x400xxxxx
# size   = 6                   # jmp abs.l; the only supported form
# expect = "..."               # stock bytes at the host, hex; the load-bearing guard
# entry  = "stub_label"        # resolved from the linked ELF, never assumed
# rejoin = 0x400xxxxx          # optional: where the stub jumps back, when it is not
#                              # addr + the displaced length. "none" = handled here
#                              # and returned. verify.py checks the stub jumps there;
#                              # rejoining one instruction early runs it twice
#
# [[patch]]
# owner   = "0001-some-slug"
