note    = "cave3, after the ring: the SEQ sidechain - the per-block row select, the two-section filter the audio interrupt calls once per side per sample, its per-SEQ coefficient table, and its runtime state (the sections' last input and output per side, and the block's level offset). Code and state together, cave3 being RAM. Then the level fill: its per-block and per-column hooks, the column mask for the draw slot, and its 128-column ring. And the per-SEQ slow-attack scale the estimator calls, with its 28-byte table (cave4 had no room). The telem builds add their USB telemetry writers here; telem = 3 takes it to the end of cave3."

# The audio interrupt just after the effects call at 0x4012139a returns, which is
# the window where the receive buffer holds this block's voices and 0x4009ef40 at
# 0x4012143a has not yet been able to overwrite them. Six bytes of jmp land across
# `addql #4,%sp`, `clrl %d1` and the first half of `lea 0x8000e508,%a1`, so all
# three are re-emitted before rejoining at 0x401213aa.
[[detour]]
owner  = "0006-comp-preview"
addr   = 0x401213a0
size   = 6
expect = "588f428143f9"
entry  = "comp_probe"
rejoin = 0x401213aa

# The compressor page vector's element count, 1 -> 2. The constructor at 0x400c676e
# copies this many entries from the source below and derives its own count as
# (end - begin) / 4, so the count and the source have to move together.
[[patch]]
owner   = "0006-comp-preview"
addr    = 0x400cb182
size    = 2
expect  = "7201"
replace = "7202"

# The page vector's source array. Stock points at 0x401e1b04, whose first entry is
# page 11 and whose second is page 10 - a different view's vector - so a two-entry
# array of our own is needed rather than simply widening the count.
[[patch]]
owner       = "0006-comp-preview"
addr        = 0x400cb188
size        = 4
expect      = "401e1b04"
from_symbol = "comp_pages"

# CompressorPageView's vtable +0x10, the draw slot. The stub answers page index 0
# by jumping to the stock renderer the thunk at 0x400c674c targets, so only index 1
# draws the trace, in the layout grmode picks.
[[patch]]
owner       = "0006-comp-preview"
addr        = 0x401e11b8
size        = 4
expect      = "400c674c"
from_symbol = "comp_draw"

# CompressorPageView's vtable +0x08, the key handler. The stub answers FUNC +
# an arrow and FUNC + the page key on the preview page and jumps to the stock
# handler for the rest.
[[patch]]
owner       = "0006-comp-preview"
addr        = 0x401e11b0
size        = 4
expect      = "4003a544"
from_symbol = "comp_keys"

# CompressorPageView's vtable +0x60, the set-sub-page slot. The FX page code
# resets the view to sub-page 0 when it is shown after a different page; the
# hook keeps the current sub-page instead, so coming back shows the page left.
[[patch]]
owner       = "0006-comp-preview"
addr        = 0x401e1208
size        = 4
expect      = "4003762e"
from_symbol = "comp_setsel"

