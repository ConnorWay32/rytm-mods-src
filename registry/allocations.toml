# ------------------------------------------------- the ceiling, and what is above it
#
# The startup code names the image's boundary outright, so it is no longer a
# judgement call. `make cavescan` reads all six values back out of the image and
# refuses to run if the opcodes around them have moved.
#
#   0x400007e4  copies 0x402ce000..0x402d6000 to 0x80000000, and
#               0x402d6000..0x402ddff8 - the image's last byte - to 0x80008000.
#               Two 32 KB SRAM load images.
#   0x4000083a  zeroes 0x402ce000..0x42fbb250, 44.9 MB. __bss_start = 0x402ce000.
#   Both are called from 0x400008c6 and 0x400008ca, copy first, clear second.
#
# So everything at or above 0x402ce000 is disqualified twice over: read once at boot
# as initialiser data, then overwritten with zeros. That closes, permanently, the runs
# cave1's note could only argue about - 0x402cd89c's 22,560 B above cave2, 0x402d4795
# +21611, 0x402dad60 +4048, 0x402d3828 +3026, and the 7,108 B tail. It is also why
# cave2's end address is exactly right rather than luckily right.
#
# The converse is worth more than the prohibition: NOTHING BELOW 0x402ce000 IS .bss.
# The trap octatrack-mods hit with patch_ram - a region that scans free on a stopped
# machine and is written the moment the engine runs - cannot apply to any pool here.
# For cave3 that removes the runtime-write worry entirely; what is left of its
# "what keeps this unverified" is only the question of whether the run is live table
# data that happens to read as zero, which is a different and smaller risk.

# ---------------------------------------------------------------- dead-code pools
#
# cave4..cave6 are a different KIND of space from cave1..cave3, and the difference
# decides how they have to be proven.
#
# cave1..cave3 are filler: the question about them is whether anything WRITES them.
# cave4..cave6 are whole routines inside .text that nothing calls: the question about
# them is whether anything REACHES them. Nothing writes them - .bss starts above all
# of .text, see above - so a canary is useless here, because a read-back will always
# come back clean whether or not the region is live.
#
# They exist because the filler is gone. Below the ceiling there is no unclaimed run
# left worth having: every long run of 0x00 or 0xff down there is table content, not
# padding - `make cavescan` prints what points into each one. 0x4029fbcc +1040,
# 0x402a4e80 +720 and 0x40287810 +512 are each referenced at their own start address,
# so the run IS the object; 0x402c7f4a +878 has a pointer triple at 0x402c7e98
# indexing into its middle; 0x402cb2f4 +308 is the tail of a mask table built from
# 8-byte groups; 0x4027b9ca and 0x4027bd62, +396 each, sit 0x398 apart inside a
# repeating 920-byte record.
#
# One trap governs this whole pass, and any future detour host as much as any cave.
# A ColdFire switch compiles to `jmp %pc@(table,%dn:l)` over 16-bit OFFSETS, so an
# arm's address appears nowhere in the image as a 32-bit value. Scanning for absolute
# references alone reports live switch bodies as dead: the first run of this analysis
# offered 0x4013d0de +1816, which is arm 1 of the 23-entry table at 0x4013d072.
# There are 109 such sites in .text. cavescan resolves 82 and blacks out the other 27
# across the full 64 KB a 16-bit offset can reach.
#
# What a region here had to survive to be listed:
# - the instruction before it ends the flow, so nothing falls in;
# - no 4-byte value at any even offset in the image points into it, and no address in
#   it is printed as a disassembly operand anywhere outside it. Odd-offset matches are
#   not references - a pointer or immediate is always even-aligned on this core;
# - references from inside other dead regions do not count, resolved to a fixpoint.
#   Dead routines call each other, and counting those would cut each one down to its
#   first basic block;
# - nothing in sections 1, 2 or 8 refers to it either.
#
# What keeps all three "candidate": unreachable is an argument, not an observation.
#
# Two of the three risks this note used to list are closed for these three pools, and
# closed by measurement rather than by argument:
# - The 27 unresolved jump tables cannot reach any of them. A 16-bit unsigned offset
#   reaches 0xffff, and there is no unresolved table in that window below cave4, cave5
#   or cave6. `make cavescan` blacks out those windows wholesale; here there is nothing
#   in them to black out.
# - The second code region at ~0x402ca000..0x402cc91c cannot reach them either. It sits
#   1.1 MB above cave6 and 2.8 MB above cave4 and cave5, so no PC-relative call and no
#   computed jump from it comes close; a `jsr %pc@(d16)` spans 32 KB. Its ABSOLUTE
#   references were never a gap - the pointer scan steps every even offset across the
#   whole image, that region included.
#
# The third risk, disassembly desync, was tested on 2026-09-21 and is clean near all
# three pools. A linear pass that has lost sync decodes real function entries in the
# middle of an instruction, so: every address anything treats as an entry must land on
# an instruction boundary. Of 51,682 even referenced addresses in .text, 169 (0.33%)
# do not, and only two of those are within 32 KB of any pool. Neither is a reference:
# - 0x401b2d78 has exactly one match, at 0x40268cd2, which is 2-aligned rather than
#   4-aligned and straddles two unrelated values inside a block of high-entropy data.
#   A pointer table entry would be 4-aligned.
# - 0x40030000 is a round memory-map constant with 11 matches, all in scattered rodata
#   tables and none in code.
#
# Exception vectors are ruled out too, and they were never checked before: the MAIN OS
# vector table is at 0x40000000 - below the load base - and 0x400014ae builds it as 256
# identical entries pointing at one default handler, with VBR set at 0x400014cc. No
# vector reaches a pool, and nothing writes a pool address into that table.
#
# So all five ways into a region are now excluded, for each pool:
#   fall-through          the preceding instruction is rts or braw
#   direct branch or call none anywhere in the image
#   address from data     no even-aligned word in the image points into it
#   computed pc jump      no table in range; cave6 has none within 64 KB at all
#   copy then execute     still needs the address, and no instruction carries it
#
# How to promote one. NOT a canary. cave2 and cave3 were promoted by writing
# 0xc0def00d and counting the words that changed, which answers "does anything write
# here". For .text the answer is provably no, so that test comes back clean whether
# the region is live or dead: it would look like evidence and be worth nothing.
#
# Detect ENTRY instead. Fill the pool so that entering it anywhere funnels to one
# recorder: every even slot from the start holds 0x607e, `bra.s` with displacement
# 0x7e, which lands on A+0x80, so any even entry walks forward in 128-byte steps; the
# last 128 bytes hold a bra.s aimed straight at the recorder so no walk overshoots;
# the recorder bumps a longword counter and returns. Entry at an odd address faults on
# instruction fetch, which is itself a detection. The rts returns wrong for whoever
# called, but it keeps the unit alive long enough to read the count, and misbehaviour
# after it is more evidence, not less. The probe was mod 0007-cave-probe, not part of
# this package.
#
# Flash the CONTROL build first, every time: same image, counter seeded to a non-zero
# value by 0007's `preset`, one byte different. A probe that can only ever show one
# reading proves nothing - a broken read-out path reads 0 and looks exactly like
# "never entered". Confirm the popup shows the seed before any run counts.
#
# Then exercise the cold paths, because that is where the risk actually is. A routine
# that survives compilation but is never called in normal use most likely belongs to
# service mode, a test menu, an error handler or the OS upgrade - exactly the paths
# cave2's note already admits were never covered. Normal use first, then provoked
# error paths - bad SysEx, full pattern memory, USB and Overbridge connect/disconnect,
# failed sample transfers - then factory and test modes.
#
# Run the OS-upgrade path LAST and on its own. It is the most likely home for a
# genuinely uncalled routine and the worst place to be wrong, because failing mid
# upgrade is how a unit bricks. Section 2 is the recovery path and nothing here ever
# writes it (docs/HAZARDS.md), so recovery exists - but plan that run knowing it may
# be needed.
#
# What the three routines ARE, established 2026-09-21. None references a string
# itself, and the image carries no symbol table - the promising-looking (address,
# name) pairs in rodata are 4e75 4e75, `rts rts`, read as text - but the
# neighbourhoods settle it:
# - cave6 sits 452 B after the thrower for "Future already retrieved", in the same
#   block as std::future_error (0x4025d0fb) and "Broken promise". It is inside
#   libstdc++'s std::future / promise machinery.
# - cave4 and cave5 sit in a module that formats note names - "CCDDEFFGGAAB" and
#   "%c%c%d" at 0x4023df95, used from 0x40029dd6 and 0x40029e22 - and that uses
#   vector::_M_emplace_back_aux.
#
# This matters more than it looks. The worry driving the cold-path test order was that
# a routine nobody calls belongs to service mode, an error handler or the upgrade
# path, where ordinary use proves little. Compiler-emitted library code is the other
# explanation, and it is the benign one: an unreferenced template instantiation is
# unreachable by construction, not merely unvisited.
#
# Incidentally confirming it: the TEST MODE UI ("UI TEST (LED)", 0x4025cd3e) lives at
# 0x4013dxxx, which the first run of this analysis wrongly offered as 1816 B of dead
# code and the jump-table resolver correctly reclassified as arms of the table at
# 0x4013d072. Test-mode code is accounted for, and it is not what is in these pools.
#
# NOTE: tools/layout.py POOL_OF does not list these names, so a claim against one
# fails the layout check today. That is deliberate - it stays that way until a pool is
# promoted past "candidate", so the first mod that reaches for this space has to go
# through the hardware run rather than around it.

