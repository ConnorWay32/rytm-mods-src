# The amp envelope's attack command on a trig (0x401098d4, state 0): `oril
# #0xb0000000,%d0`, re-emitted, rejoining at 0x40109b0a. With ENV RESET's amp bit
# set the stub sends the instant drop to -128 instead; with bit_probe it is the
# bit probe that found it.
[[cave]]
owner = "0015-env-reset-amp"
addr  = 0x400298e4
size  = 0x6c
note  = "cave13, after 0014: the amp attack gate, or with bit_probe the bit probe."

[[detour]]
owner  = "0015-env-reset-amp"
addr   = 0x40109b04
size   = 6
expect = "0080b0000000"
entry  = "amp_attack"

# Bit probe: the VCA overdrive word's store, `movew %d0,%a5@(42)`, becomes
# `clrw %a5@(42)`, so OVR only selects the bit.
[[patch]]
owner   = "0015-env-reset-amp"
addr    = 0x40109aae
size    = 4
expect  = "3b40002a"       # movew %d0,%a5@(42)
replace = "426d002a"       # clrw %a5@(42)
gate    = "bit_probe"

